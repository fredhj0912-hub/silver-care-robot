<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200">
  <defs>
    <!-- Arrow marker definition -->
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#333333" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="1200" fill="#FFFFFF" />

  <!-- Title -->
  <text x="400" y="70" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="#111111">실버케어 로봇 기능 플로우차트</text>

  <!-- Group for Flowchart Elements -->
  <g font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="14" fill="#333333">
    
    <!-- ================= BOX 1 ================= -->
    <!-- Parallelogram 1 -->
    <polygon points="270,160 530,140 530,200 270,220" fill="#EAEAEA" stroke="#111111" stroke-width="2" />
    <text x="400" y="185" font-size="16" font-weight="bold" text-anchor="middle" fill="#000000">센서 및 사용자 입력 수집</text>

    <!-- Connection Arrow 1-2 -->
    <line x1="400" y1="210" x2="400" y2="290" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)" />

    <!-- Right Side Diamond 1 (Between 1 and 2) -->
    <polygon points="580,250 670,220 760,250 670,280" fill="#EAEAEA" stroke="#111111" stroke-width="2" />
    <text x="670" y="255" font-size="12" text-anchor="middle" fill="#000000">음성, 웹캠, 가속도 센서</text>
    
    <!-- Connect Arrow to Diamond 1 -->
    <line x1="400" y1="250" x2="580" y2="250" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)" />


    <!-- ================= BOX 2 ================= -->
    <!-- Parallelogram 2 -->
    <polygon points="270,300 530,280 530,340 270,360" fill="#EAEAEA" stroke="#111111" stroke-width="2" />
    <text x="400" y="325" font-size="16" font-weight="bold" text-anchor="middle" fill="#000000">실시간 데이터 처리 및 AI 분석</text>

    <!-- Connection Arrow 2-3 -->
    <line x1="400" y1="350" x2="400" y2="430" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)" />

    <!-- Right Side Diamond 2 (Between 2 and 3) -->
    <polygon points="580,390 670,360 760,390 670,420" fill="#EAEAEA" stroke="#111111" stroke-width="2" />
    <text x="670" y="395" font-size="12" text-anchor="middle" fill="#000000">Web Speech &amp; Gemini 3.5</text>

    <!-- Connect Arrow to Diamond 2 -->
    <line x1="400" y1="390" x2="580" y2="390" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)" />


    <!-- ================= BOX 3 ================= -->
    <!-- Parallelogram 3 -->
    <polygon points="270,440 530,420 530,480 270,500" fill="#EAEAEA" stroke="#111111" stroke-width="2" />
    <text x="400" y="465" font-size="16" font-weight="bold" text-anchor="middle" fill="#000000">위급 상황 실시간 판별</text>

    <!-- Connection Arrow 3-4 -->
    <line x1="400" y1="490" x2="400" y2="570" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)" />

    <!-- Right Side Diamond 3 (Between 3 and 4) -->
    <polygon points="580,530 670,500 760,530 670,560" fill="#EAEAEA" stroke="#111111" stroke-width="2" />
    <text x="670" y="535" font-size="12" text-anchor="middle" fill="#000000">낙상 감지 또는 SOS 격발</text>

    <!-- Connect Arrow to Diamond 3 -->
    <line x1="400" y1="530" x2="580" y2="530" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)" />


    <!-- ================= BOX 4 ================= -->
    <!-- Parallelogram 4 -->
    <polygon points="270,580 530,560 530,620 270,640" fill="#EAEAEA" stroke="#111111" stroke-width="2" />
    <text x="400" y="605" font-size="16" font-weight="bold" text-anchor="middle" fill="#000000">비상 경보 및 AWS 클라우드 연동</text>

    <!-- Connection Arrow 4-5 -->
    <line x1="400" y1="630" x2="400" y2="710" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)" />


    <!-- ================= BOX 5 ================= -->
    <!-- Parallelogram 5 -->
    <polygon points="270,720 530,700 530,760 270,780" fill="#EAEAEA" stroke="#111111" stroke-width="2" />
    <text x="400" y="745" font-size="16" font-weight="bold" text-anchor="middle" fill="#000000">단말기 로컬 경보 수동 해제</text>

    <!-- Connection Arrow 5-6 -->
    <line x1="400" y1="770" x2="400" y2="850" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)" />


    <!-- ================= BOX 6 ================= -->
    <!-- Parallelogram 6 -->
    <polygon points="270,860 530,840 530,900 270,920" fill="#EAEAEA" stroke="#111111" stroke-width="2" />
    <text x="400" y="885" font-size="16" font-weight="bold" text-anchor="middle" fill="#000000">대화 모드 복귀 및 상태 리셋</text>


    <!-- ================= LEFT RETURN LINE ================= -->
    <!-- Arrow from Box 6 back to Box 1 -->
    <!-- Start at left of Box 6: (270, 890) -->
    <!-- Go left to X=90 -->
    <!-- Go up to Y=180 -->
    <!-- Go right to left of Box 1: (270, 180) -->
    <path d="M 270,890 L 90,890 L 90,180 L 270,180" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)" />
    
    <!-- Label on the left vertical return line -->
    <text x="140" y="525" font-size="14" text-anchor="middle" fill="#333333">자동 모니터링 순찰 루프</text>

  </g>
</svg>
